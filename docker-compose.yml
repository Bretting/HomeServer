# ═══════════════════════════════════════════════════════════════════
#  Home Server stack
#  See README.md for the full setup walkthrough.
#
#  Quick start:
#    cp .env.example .env  &&  nano .env
#    docker compose up -d
# ═══════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────
  #  HOME AUTOMATION
  #
  #  Home Assistant is NOT a container here — to get the add-on store you
  #  need the Supervisor, which only comes with Home Assistant OS (HAOS).
  #  HAOS runs in a KVM virtual machine alongside this Docker stack.
  #  See:  homeassistant-vm/install-haos-vm.sh  and  homeassistant-vm/README.md
  #  Web UI once running:  http://<haos-vm-ip>:8123
  # ─────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────
  #  MEDIA SERVER  (hardware transcoding via AMD VAAPI)
  # ─────────────────────────────────────────────────────────────────
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/media
    devices:
      - /dev/dri:/dev/dri        # AMD GPU for hardware transcoding
    ports:
      - "8096:8096"
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    # Web UI: http://<server-ip>:8096
    # After setup: Dashboard > Playback > enable VAAPI transcoding.

  # ─────────────────────────────────────────────────────────────────
  #  BOOKS  (reader apps connect over OPDS)
  # ─────────────────────────────────────────────────────────────────
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    volumes:
      - ${CONFIG_ROOT}/kavita:/kavita/config
      - ${DATA_ROOT}/media/books:/books
    ports:
      - "5000:5000"
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    # Web UI: http://<server-ip>:5000

  # ─────────────────────────────────────────────────────────────────
  #  DOWNLOAD VPN  +  TORRENT CLIENT
  #  qBittorrent shares Gluetun's network: if the VPN drops, torrents
  #  stop. There is no leak path.
  # ─────────────────────────────────────────────────────────────────
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"              # qBittorrent WebUI (published via gluetun)
      - "6881:6881"              # torrent TCP
      - "6881:6881/udp"          # torrent UDP
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET}   # keep WebUI reachable on LAN
      - TZ=${TZ}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # <-- all traffic through the VPN
    depends_on:
      - gluetun
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data              # shared root enables hardlinks
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    restart: unless-stopped
    # Web UI: http://<server-ip>:8080  (default login: admin / see logs for pw)

  # ─────────────────────────────────────────────────────────────────
  #  AUTOMATION LAYER  ("*arr" apps)
  #  Prowlarr feeds indexers to Sonarr/Radarr/Readarr, which send
  #  grabs to qBittorrent and file the results into ${DATA_ROOT}/media.
  # ─────────────────────────────────────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "9696:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped

  # Helps Prowlarr solve Cloudflare/JS challenges on protected indexers.
  # In Prowlarr: Settings > Indexers > add a FlareSolverr proxy at
  # http://flaresolverr:8191, then tag the indexers that need it.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    restart: unless-stopped

  # Recyclarr applies TRaSH-Guides quality profiles/custom formats to
  # Sonarr & Radarr on a schedule, so downloads are well-sized and good
  # quality without hand-tuning. Edit ${CONFIG_ROOT}/recyclarr/recyclarr.yml
  # (add each app's URL + API key). First run:
  #   docker compose run --rm recyclarr config create
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    volumes:
      - ${CONFIG_ROOT}/recyclarr:/config
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=@daily
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8989:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "7878:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped

  # Readarr was retired by its developers and LinuxServer deprecated the image
  # (June/July 2025) — the develop/nightly/latest tags no longer pull. Add
  # ebooks directly into ${DATA_ROOT}/media/books instead; Kavita serves them.
  # For book automation later, consider LazyLibrarian or a Readarr fork.

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "6767:6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped

  # Jellyseerr: a friendly request page for the family. They browse and
  # request movies/shows; approved requests flow into Radarr/Sonarr.
  # First run: connect it to Jellyfin, then to Radarr & Sonarr in its UI.
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  #  NETWORK: reverse proxy + ad-blocking DNS
  # ─────────────────────────────────────────────────────────────────

  # Caddy gives every web UI a clean https://name.home.lan address with
  # automatic TLS (self-signed internal CA on the LAN). Edit ./caddy/Caddyfile.
  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_ROOT}/caddy/data:/data
      - ${CONFIG_ROOT}/caddy/config:/config
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  # AdGuard Home: network-wide ad/tracker blocking + local DNS.
  # First run: open http://<server-ip>:3000 to run the setup wizard, and set
  # the admin interface to listen on port 80 (maps to host :8083 below).
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    ports:
      - "53:53/tcp"            # DNS
      - "53:53/udp"            # DNS
      - "3000:3000/tcp"        # initial setup wizard (one-time)
      - "8083:80/tcp"          # admin dashboard after setup
    volumes:
      - ${CONFIG_ROOT}/adguardhome/work:/opt/adguardhome/work
      - ${CONFIG_ROOT}/adguardhome/conf:/opt/adguardhome/conf
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  #  BACKUP TARGET for the Home Assistant VM
  #  A small SMB share so HAOS can drop its full backups onto the host, where
  #  restic (scripts/backup.sh backs up CONFIG_ROOT) then versions them and
  #  ships them off-site. See homeassistant-vm/README.md > Backups.
  #  Reachable on the LAN only — restrict port 445 with the firewall.
  # ─────────────────────────────────────────────────────────────────
  samba:
    image: dperson/samba:latest
    platform: linux/amd64      # old multi-arch image lacks an amd64/v3 variant
    container_name: samba
    command: >
      -u "${SMB_USER};${SMB_PASSWORD}"
      -s "ha-backups;/share;yes;no;no;${SMB_USER}"
      -p
    ports:
      - "445:445"
    volumes:
      - ${CONFIG_ROOT}/ha-backups:/share
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  #  MANAGEMENT & MONITORING
  # ─────────────────────────────────────────────────────────────────
  dockge:
    image: louislam/dockge:latest
    container_name: dockge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_ROOT}/dockge:/app/data
      - ${CONFIG_ROOT}/dockge/stacks:/opt/stacks
    ports:
      - "5001:5001"
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
    restart: unless-stopped
    # Web UI: http://<server-ip>:5001

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - ${CONFIG_ROOT}/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped
    # Web UI: http://<server-ip>:3001  (has a push app for phone alerts)

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    restart: unless-stopped
    # Live container logs in the browser: http://<server-ip>:8888

  # Homepage: one dashboard linking every service, with live status.
  # Configure via YAML in ${CONFIG_ROOT}/homepage (services.yaml, widgets.yaml).
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    volumes:
      - ./homepage:/app/config                         # starter config in the repo
      - /var/run/docker.sock:/var/run/docker.sock:ro   # for container status
    ports:
      - "3010:3000"
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
    restart: unless-stopped
    # Web UI: http://<server-ip>:3010

  # ntfy: self-hosted push notifications. Point Uptime Kuma (and HA, *arr,
  # etc.) at it, subscribe to your topic in the ntfy phone app.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    volumes:
      - ${CONFIG_ROOT}/ntfy/cache:/var/cache/ntfy
      - ${CONFIG_ROOT}/ntfy/etc:/etc/ntfy
    ports:
      - "8085:80"
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    # Web UI: http://<server-ip>:8085

  # Scrutiny: disk SMART-health monitoring — warns before a drive dies.
  # List your actual drives under `devices:` (find them with `lsblk`).
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO            # add SYS_ADMIN as well if you have NVMe drives
    ports:
      - "8084:8080"
    volumes:
      - ${CONFIG_ROOT}/scrutiny/config:/opt/scrutiny/config
      - ${CONFIG_ROOT}/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      - "/dev/sda"           # <-- edit to match your disks (lsblk); add more lines
      # - "/dev/sdb"
      # - "/dev/nvme0"
    restart: unless-stopped
    # Web UI: http://<server-ip>:8084

  # Mealie: family recipe manager (import by URL, meal plans, shopping lists).
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    volumes:
      - ${CONFIG_ROOT}/mealie:/app/data
    ports:
      - "9925:9000"
    environment:
      - TZ=${TZ}
      - BASE_URL=${MEALIE_BASE_URL}
      - ALLOW_SIGNUP=false
    restart: unless-stopped
    # Web UI: http://<server-ip>:9925

  # Auto-update containers. Runs at 04:00 daily. Set to monitor-only by
  # removing --cleanup and adding WATCHTOWER_MONITOR_ONLY=true if you'd
  # rather update by hand.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
    restart: unless-stopped
