# Homepage services — https://gethomepage.dev/configs/services/
#
# Tiles point at the server's TAILSCALE IP (100.111.165.26) so they work
# from anywhere you're on the tailnet — at home or on the train — without
# depending on which Wi-Fi/LAN you're on. Every device that opens the
# dashboard must have Tailscale running and be logged into the tailnet.
#
# ► Home Assistant still uses HAOS_IP — replace it with the HA VM's LAN IP
#   once that VM is built (it's not on the tailnet itself).
# ► Prefer names? Once Caddy + AdGuard are up, swap the hrefs for the
#   https://name.home.lan addresses from caddy/Caddyfile.
#
# `server:`/`container:` show live status via the Docker socket (docker.yaml).
# Optional API widgets (which need each app's API key) are shown commented.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://100.111.165.26:8096
        description: Movies & TV
        server: my-docker
