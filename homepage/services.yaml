# Homepage services — https://gethomepage.dev/configs/services/
#
# ► BEFORE USE: find-and-replace the two placeholders:
#     CHANGE_ME  -> your server's LAN IP (e.g. 192.168.1.10)
#     HAOS_IP    -> your Home Assistant VM's IP
#   (Or, once Caddy + AdGuard are up, swap the hrefs for the
#    https://name.home.lan addresses from caddy/Caddyfile.)
#
# `server:`/`container:` show live status via the Docker socket (docker.yaml).
# Optional API widgets (which need each app's API key) are shown commented.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://CHANGE_ME:8096
        description: Movies & TV
        server: my-docker
        container: jellyfin
        # widget:
        #   type: jellyfin
        #   url: http://jellyfin:8096
        #   key: YOUR_API_KEY
